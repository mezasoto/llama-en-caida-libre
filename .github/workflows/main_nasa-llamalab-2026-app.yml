
name: Deploy NASA LlamaLab to Azure

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build React and Node.js
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React frontend
        working-directory: ./frontend
        env:
          VITE_API_URL: ""
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Build Express backend
        working-directory: ./backend
        run: npm run build

      - name: Test backend integration contracts
        working-directory: ./backend
        run: node --test tests/*.test.mjs

      - name: Prepare deployment
        shell: pwsh
        run: ./scripts/prepare-deploy.ps1

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: nasa-llamalab-app
          path: deploy/
          if-no-files-found: error

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: azure-production
      cancel-in-progress: false

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: nasa-llamalab-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3DD7833374AD4A43BB004CC2CDE748F4 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A6A57151342642C7A4DFD8188B399801 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_4E886B783EC844EFB51B331BB1A50FE4 }}

      - name: Deploy LlamaLab
        uses: azure/webapps-deploy@v3
        with:
          app-name: nasa-llamalab-2026-app
          slot-name: Production
          package: deploy

      - name: Verify public deployment
        run: node scripts/smoke.mjs https://nasa-llamalab-2026-app-dccwa9gqg7eqhmgp.brazilsouth-01.azurewebsites.net

      - name: Inspect non-secret runtime metadata on failure
        if: failure()
        shell: bash
        run: |
          az webapp show --resource-group rg_nasa_llamalab --name nasa-llamalab-2026-app --query '{state:state,enabled:enabled,defaultHostName:defaultHostName,kind:kind}'
          az webapp config show --resource-group rg_nasa_llamalab --name nasa-llamalab-2026-app --query '{nodeVersion:nodeVersion,windowsFxVersion:windowsFxVersion}'
